<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Nunito", "Trebuchet MS", sans-serif; color: #3a2a25; }
    a { color: #7a4bb6; } a:hover { color: #5c3590; }
  </style>
</helmet>
<div style="width: 960px; height: 640px; box-sizing: border-box; background: #fffdf7; padding: 36px 40px; display: flex; flex-direction: column; gap: 18px;">
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #9a63d6;">Controles en celular</div>
    <div style="font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 34px; line-height: 1;">Dos pulgares, cuatro botones</div>
  </div>
  <img src="controls.png" style="width: 844px; height: 390px; display: block; border: 3px solid #3a2a25; border-radius: 18px;">
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; font-size: 14px; line-height: 1.5;">
    <div>Pulgar izquierdo: joystick flotante que aparece donde tocas. Empujar hacia arriba también salta.</div>
    <div>Pulgar derecho: golpe y agarrar abajo (los más usados), salto y pedo arriba. El botón de pedo se enciende solo cuando llevas frijol.</div>
  </div>
</div>
</x-dc>
